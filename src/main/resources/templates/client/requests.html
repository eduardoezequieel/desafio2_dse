<!DOCTYPE html>
<html th:replace="~{layout/client :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org" lang="es">
<head><title>Mis Solicitudes — DSE</title></head>
<body>
<main>
<style>
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .toolbar-select {
        padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px;
        font-size: 13px; background: var(--bg-secondary); color: var(--text-primary); cursor: pointer;
    }
    .requests-list { display: flex; flex-direction: column; gap: 12px; }
    .request-card {
        background: var(--bg-primary); border-radius: 10px;
        border: 1px solid var(--border-color); padding: 20px 22px;
        box-shadow: var(--shadow-sm); display: flex; align-items: center;
        gap: 18px; cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s;
        text-decoration: none; color: inherit;
    }
    .request-card:hover { box-shadow: var(--shadow-md, 0 4px 16px rgba(0,0,0,0.1)); border-color: var(--color-primary); }
    .request-icon {
        width: 44px; height: 44px; border-radius: 10px;
        background: var(--color-primary-light); display: flex;
        align-items: center; justify-content: center; flex-shrink: 0;
    }
    .request-icon svg { width: 22px; height: 22px; fill: var(--color-primary); }
    .request-info { flex: 1; min-width: 0; }
    .request-service { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
    .request-meta { font-size: 12px; color: var(--text-tertiary); }
    .request-notes { font-size: 12px; color: var(--text-secondary); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px; }
    .status-chip {
        padding: 5px 12px; border-radius: 999px;
        font-size: 12px; font-weight: 700; white-space: nowrap;
        text-transform: uppercase; letter-spacing: 0.04em;
    }
    .chevron { color: var(--text-tertiary); flex-shrink: 0; }
    .chevron svg { width: 18px; height: 18px; fill: currentColor; }
    .empty-state { text-align: center; padding: 64px; color: var(--text-tertiary); }
    .empty-state svg { width: 48px; height: 48px; fill: currentColor; opacity: 0.3; display: block; margin: 0 auto 14px; }
    .empty-state a { color: var(--color-primary); font-weight: 600; text-decoration: none; }
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
    .alert-danger { background: var(--color-danger-bg); color: var(--color-danger-text); border: 1px solid var(--color-danger-border); }
</style>

<div id="errorAlert" class="alert alert-danger" style="display:none;"></div>

<div class="toolbar">
    <select id="filterStatus" class="toolbar-select" onchange="applyFilter()">
        <option value="">Todos los estados</option>
        <option value="PENDING">Pendiente</option>
        <option value="IN_REVIEW">En revisión</option>
        <option value="IN_PROGRESS">En progreso</option>
        <option value="COMPLETED">Completado</option>
        <option value="REJECTED">Rechazado</option>
        <option value="CANCELLED">Cancelado</option>
    </select>
</div>

<div id="requestsList" class="requests-list">
    <p style="color:var(--text-tertiary); font-size:14px;">Cargando solicitudes...</p>
</div>

<script>
    let allRequests = [];

    loadRequests();

    function loadRequests() {
        authFetch('/api/requests/my')
            .then(r => r.json())
            .then(data => {
                allRequests = data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                applyFilter();
            })
            .catch(() => showError('Error al cargar solicitudes'));
    }

    function applyFilter() {
        const status = document.getElementById('filterStatus').value;
        const filtered = status ? allRequests.filter(r => r.status === status) : allRequests;
        render(filtered);
    }

    function render(requests) {
        const list = document.getElementById('requestsList');
        if (!requests.length) {
            list.innerHTML = `<div class="empty-state">
                <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                <p>No tienes solicitudes aún. <a href="/client/services">Explora nuestros servicios</a></p>
            </div>`;
            return;
        }
        list.innerHTML = requests.map(r => `
            <a href="/client/requests/${r.id}" class="request-card">
                <div class="request-icon">
                    <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                </div>
                <div class="request-info">
                    <div class="request-service">${escHtml(r.serviceName)}</div>
                    <div class="request-meta">#${r.id} &middot; ${formatDate(r.createdAt)}</div>
                    ${r.notes ? `<div class="request-notes">"${escHtml(r.notes)}"</div>` : ''}
                </div>
                <span class="status-chip" style="background:${r.statusColor}22; color:${r.statusColor};">${r.statusLabel}</span>
                <div class="chevron"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
            </a>
        `).join('');
    }

    function formatDate(d) {
        return new Date(d).toLocaleDateString('es-ES', { year:'numeric', month:'short', day:'numeric' });
    }
    function escHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function showError(msg) {
        const el = document.getElementById('errorAlert');
        el.textContent = msg; el.style.display = 'block';
    }
</script>
</main>
</body>
</html>
