<!DOCTYPE html>
<html th:replace="~{layout/client :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org" lang="es">
<head><title>Detalle de Solicitud — DSE</title></head>
<body>
<main>
<style>
    .back-link {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 13px; font-weight: 600; color: var(--text-secondary);
        text-decoration: none; margin-bottom: 20px;
        transition: color 0.15s;
    }
    .back-link:hover { color: var(--color-primary); }
    .back-link svg { width: 16px; height: 16px; fill: currentColor; }

    .detail-grid {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 20px;
        align-items: start;
    }
    @media (max-width: 800px) { .detail-grid { grid-template-columns: 1fr; } }

    .card {
        background: var(--bg-primary); border-radius: 12px;
        border: 1px solid var(--border-color); padding: 24px;
        box-shadow: var(--shadow-sm);
    }
    .card-title {
        font-size: 13px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.07em; color: var(--text-tertiary); margin-bottom: 16px;
    }

    /* Status hero */
    .status-hero {
        display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
        padding: 18px 20px; border-radius: 10px;
    }
    .status-hero-dot {
        width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
    }
    .status-hero-label { font-size: 20px; font-weight: 800; }
    .status-hero-sub { font-size: 13px; margin-top: 2px; opacity: 0.75; }

    /* Service info */
    .info-row {
        display: flex; justify-content: space-between;
        padding: 10px 0; border-bottom: 1px solid var(--border-light);
        font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: var(--text-secondary); }
    .info-row .value { font-weight: 600; color: var(--text-primary); text-align: right; max-width: 60%; }

    .notes-box {
        background: var(--bg-secondary); border-radius: 8px;
        padding: 14px; font-size: 13px; color: var(--text-secondary);
        line-height: 1.6; margin-top: 16px; font-style: italic;
        border-left: 3px solid var(--color-primary);
    }

    /* Cancel button */
    .btn-cancel {
        width: 100%; margin-top: 16px; padding: 10px;
        background: transparent; border: 1px solid var(--color-danger-border, #fca5a5);
        color: var(--color-danger); border-radius: 8px; font-size: 13px;
        font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    .btn-cancel:hover { background: var(--color-danger-bg); }

    /* Timeline */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before {
        content: ''; position: absolute; left: 9px; top: 6px;
        bottom: 6px; width: 2px; background: var(--border-color);
    }
    .timeline-item { position: relative; margin-bottom: 22px; }
    .timeline-item:last-child { margin-bottom: 0; }
    .timeline-dot {
        position: absolute; left: -23px; top: 3px;
        width: 14px; height: 14px; border-radius: 50%;
        border: 2px solid var(--bg-primary); flex-shrink: 0;
    }
    .timeline-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .timeline-label { font-size: 13px; font-weight: 700; }
    .timeline-date { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
    .timeline-comment { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
    .alert-danger { background: var(--color-danger-bg); color: var(--color-danger-text); border: 1px solid var(--color-danger-border); }

    /* Confirm overlay */
    .confirm-overlay {
        display: none; position: fixed; z-index: 300; inset: 0;
        background: rgba(0,0,0,0.5); justify-content: center; align-items: center;
    }
    .confirm-overlay.show { display: flex; }
    .confirm-box {
        background: var(--bg-primary); border-radius: 12px;
        padding: 26px 28px; max-width: 360px; width: 90%;
        box-shadow: var(--shadow-lg);
    }
    .confirm-box h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .confirm-box p  { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
    .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn { padding: 9px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-secondary { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border-color); }
    .btn-danger { background: var(--color-danger); color: white; }
</style>

<div id="errorAlert" class="alert alert-danger" style="display:none;"></div>

<a href="/client/requests" class="back-link">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Volver a mis solicitudes
</a>

<div id="detailContent" class="detail-grid" style="display:none;">
    <!-- Left: status + service info -->
    <div style="display:flex; flex-direction:column; gap:20px;">
        <div class="card">
            <div id="statusHero" class="status-hero"></div>
            <div class="card-title">Información del servicio</div>
            <div id="serviceInfo"></div>
            <div id="notesBox"></div>
            <button id="cancelBtn" class="btn-cancel" onclick="openConfirm()" style="display:none;">
                Cancelar solicitud
            </button>
        </div>
    </div>

    <!-- Right: timeline -->
    <div class="card">
        <div class="card-title">Historial de estados</div>
        <div id="timeline" class="timeline"></div>
    </div>
</div>

<!-- Cancel confirm -->
<div id="confirmOverlay" class="confirm-overlay">
    <div class="confirm-box">
        <h3>¿Cancelar solicitud?</h3>
        <p>Esta acción no se puede deshacer. Tu solicitud pasará a estado cancelado.</p>
        <div class="confirm-actions">
            <button class="btn btn-secondary" onclick="closeConfirm()">No, mantener</button>
            <button class="btn btn-danger"    onclick="confirmCancel()">Sí, cancelar</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const requestId = [[${requestId}]];

    loadDetail();

    function loadDetail() {
        authFetch(`/api/requests/${requestId}`)
            .then(r => {
                if (!r.ok) throw new Error('No encontrado');
                return r.json();
            })
            .then(render)
            .catch(err => showError('Error al cargar la solicitud: ' + err.message));
    }

    function render(r) {
        // Status hero
        document.getElementById('statusHero').innerHTML = `
            <div class="status-hero-dot" style="background:${r.statusColor};"></div>
            <div>
                <div class="status-hero-label" style="color:${r.statusColor};">${r.statusLabel}</div>
                <div class="status-hero-sub" style="color:${r.statusColor};">Solicitud #${r.id}</div>
            </div>
        `;
        document.getElementById('statusHero').style.background = r.statusColor + '18';

        // Service info
        document.getElementById('serviceInfo').innerHTML = `
            <div class="info-row"><span class="label">Servicio</span><span class="value">${escHtml(r.serviceName)}</span></div>
            <div class="info-row"><span class="label">Precio</span><span class="value">${escHtml(r.servicePrice)}</span></div>
            <div class="info-row"><span class="label">Tiempo estimado</span><span class="value">${escHtml(r.serviceEstimatedTime)}</span></div>
            <div class="info-row"><span class="label">Fecha de solicitud</span><span class="value">${formatDate(r.createdAt)}</span></div>
            <div class="info-row"><span class="label">Última actualización</span><span class="value">${formatDate(r.updatedAt)}</span></div>
        `;

        // Notes
        if (r.notes) {
            document.getElementById('notesBox').innerHTML =
                `<div class="notes-box">"${escHtml(r.notes)}"</div>`;
        }

        // Cancel button — only if PENDING
        if (r.status === 'PENDING') {
            document.getElementById('cancelBtn').style.display = 'block';
        }

        // Timeline
        const timeline = document.getElementById('timeline');
        if (r.history && r.history.length) {
            timeline.innerHTML = r.history.map((h, i) => `
                <div class="timeline-item">
                    <div class="timeline-dot" style="background:${h.color};"></div>
                    <div class="timeline-header">
                        <span class="timeline-label" style="color:${h.color};">${h.label}</span>
                        <span class="timeline-date">${formatDatetime(h.changedAt)}</span>
                    </div>
                    ${h.comment ? `<div class="timeline-comment">${escHtml(h.comment)}</div>` : ''}
                </div>
            `).join('');
        } else {
            timeline.innerHTML = '<p style="font-size:13px;color:var(--text-tertiary);">Sin historial aún.</p>';
        }

        document.getElementById('detailContent').style.display = 'grid';
    }

    function openConfirm()  { document.getElementById('confirmOverlay').classList.add('show'); }
    function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('show'); }

    function confirmCancel() {
        authFetch(`/api/requests/${requestId}/cancel`, { method: 'PATCH' })
            .then(r => {
                if (r.ok || r.status === 204) {
                    closeConfirm();
                    loadDetail();
                } else return r.json().then(e => { throw new Error(e.message); });
            })
            .catch(err => { closeConfirm(); showError('Error al cancelar: ' + err.message); });
    }

    function formatDate(d) {
        return new Date(d).toLocaleDateString('es-ES', { year:'numeric', month:'short', day:'numeric' });
    }
    function formatDatetime(d) {
        return new Date(d).toLocaleString('es-ES', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    }
    function escHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function showError(msg) {
        const el = document.getElementById('errorAlert');
        el.textContent = msg; el.style.display = 'block';
    }
</script>
</main>
</body>
</html>
