<!DOCTYPE html>
<html th:fragment="layout(pageTitle, content)"
      xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${pageTitle}">DSE Cliente</title>
    <script>
        (function () {
            var saved = localStorage.getItem('theme-preference');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="/css/theme-variables.css">
    <script src="/js/theme.js"></script>
    <script src="/js/dashboard.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-layout { display: flex; min-height: 100vh; }

        /* ── Sidebar ── */
        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            z-index: 100;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .sidebar-header { padding: 24px 20px 20px; border-bottom: 1px solid var(--border-light); }

        .sidebar-header .brand {
            display: flex; align-items: center; gap: 10px; text-decoration: none;
        }

        .sidebar-header .brand-icon {
            width: 36px; height: 36px;
            background: var(--gradient-primary);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        .sidebar-header .brand-icon svg { width: 20px; height: 20px; fill: white; }

        .sidebar-header .brand-name { font-size: 18px; font-weight: 700; color: var(--text-primary); line-height: 1; }
        .sidebar-header .brand-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }

        .nav-section-label {
            font-size: 10px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--text-tertiary);
            padding: 0 8px; margin-bottom: 6px; margin-top: 16px;
        }
        .nav-section-label:first-child { margin-top: 0; }

        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 10px; border-radius: 6px;
            text-decoration: none; color: var(--text-secondary);
            font-size: 14px; font-weight: 500;
            transition: background-color 0.15s, color 0.15s;
            margin-bottom: 2px;
        }

        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; transition: opacity 0.15s; }
        .nav-item:hover { background-color: var(--bg-secondary); color: var(--text-primary); }
        .nav-item:hover svg { opacity: 1; }
        .nav-item.active { background-color: var(--color-primary-light); color: var(--color-primary); font-weight: 600; }
        .nav-item.active svg { opacity: 1; }

        .sidebar-footer {
            padding: 16px 12px;
            border-top: 1px solid var(--border-light);
            display: flex; flex-direction: column; gap: 8px;
        }

        .user-card {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px; border-radius: 6px;
            background-color: var(--bg-secondary);
        }

        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--gradient-primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: white; flex-shrink: 0;
        }

        .user-details { flex: 1; min-width: 0; }

        .user-email {
            font-size: 12px; font-weight: 600; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .user-role {
            font-size: 10px; color: var(--color-primary); font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        .sidebar-actions { display: flex; gap: 6px; }

        .btn-sidebar {
            flex: 1; padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px; background: transparent;
            color: var(--text-secondary); font-size: 12px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 5px; transition: background-color 0.15s, color 0.15s, border-color 0.15s;
        }

        .btn-sidebar svg { width: 14px; height: 14px; }
        .btn-sidebar:hover { background-color: var(--bg-secondary); color: var(--text-primary); }
        .btn-sidebar.btn-danger:hover {
            background-color: var(--color-danger-bg);
            color: var(--color-danger);
            border-color: var(--color-danger-border);
        }

        /* ── Main content ── */
        .main-content { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

        .top-bar {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 0 28px; height: 56px;
            display: flex; align-items: center;
            position: sticky; top: 0; z-index: 50;
            transition: background-color 0.3s ease;
        }

        .top-bar-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }

        .page-body { padding: 28px; flex: 1; }
    </style>
</head>
<body>
<div class="app-layout">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="/client/dashboard" class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                    </svg>
                </div>
                <div>
                    <div class="brand-name">DSE</div>
                    <div class="brand-sub">Portal de cliente</div>
                </div>
            </a>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section-label">Mi panel</div>

            <a href="/client/dashboard"
               th:classappend="${activePage == 'home'} ? ' active'"
               class="nav-item">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                Inicio
            </a>

            <a href="/client/services"
               th:classappend="${activePage == 'services'} ? ' active'"
               class="nav-item">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                Servicios
            </a>

            <a href="/client/requests"
               th:classappend="${activePage == 'requests'} ? ' active'"
               class="nav-item">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                Mis Solicitudes
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar" id="sidebarAvatar">?</div>
                <div class="user-details">
                    <div class="user-email" id="sidebarEmail" th:text="${userEmail}">cliente@example.com</div>
                    <div class="user-role" id="sidebarRole" th:text="${userRole}">CLIENT</div>
                </div>
            </div>
            <div class="sidebar-actions">
                <button class="btn-sidebar" onclick="toggleTheme()" title="Cambiar tema">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                    </svg>
                    Tema
                </button>
                <button class="btn-sidebar btn-danger" onclick="logout()" title="Cerrar sesión">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                    </svg>
                    Salir
                </button>
            </div>
        </div>
    </aside>

    <!-- ── Main content ── -->
    <div class="main-content">
        <header class="top-bar">
            <span class="top-bar-title" th:text="${pageHeading}">Mi Panel</span>
        </header>

        <div class="page-body" th:replace="${content}">
            <!-- page content injected here -->
        </div>
    </div>
</div>

<script>
    (function () {
        const email = document.getElementById('sidebarEmail')?.textContent?.trim() || '';
        const avatar = document.getElementById('sidebarAvatar');
        if (avatar && email) {
            avatar.textContent = email.charAt(0).toUpperCase();
        }
    })();
</script>
</body>
</html>
