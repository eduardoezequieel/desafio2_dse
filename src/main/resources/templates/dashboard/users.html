<!DOCTYPE html>
<html th:replace="~{layout/main :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head>
    <title>Usuarios — DSE Admin</title>
</head>
<body>
<main>
    <style>
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: opacity 0.15s, transform 0.15s;
        }

        .btn:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-sm {
            padding: 5px 11px;
            font-size: 12px;
        }

        .btn-edit {
            background-color: var(--color-info);
            color: white;
        }

        .btn-delete {
            background-color: var(--color-danger);
            color: white;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .alert-danger {
            background-color: var(--color-danger-bg);
            color: var(--color-danger-text);
            border: 1px solid var(--color-danger-border);
        }

        .alert-success {
            background-color: var(--color-success-bg);
            color: var(--color-success-text);
            border: 1px solid var(--color-success-border);
        }

        .table-card {
            background: var(--bg-primary);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th {
            background-color: var(--bg-secondary);
            padding: 11px 14px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }

        .users-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            font-size: 14px;
        }

        .users-table tbody tr:last-child td {
            border-bottom: none;
        }

        .users-table tbody tr:hover td {
            background-color: var(--bg-secondary);
        }

        .td-actions {
            display: flex;
            gap: 6px;
        }

        .role-badge {
            background: var(--color-primary-light);
            color: var(--color-primary);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-tertiary);
            font-size: 14px;
        }

        /* ── Modal ── */
        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.45);
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--bg-primary);
            padding: 28px;
            border-radius: 10px;
            width: 90%;
            max-width: 460px;
            box-shadow: var(--shadow-lg);
            color: var(--text-primary);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 17px;
            font-weight: 700;
        }

        .close {
            font-size: 24px;
            line-height: 1;
            color: var(--text-tertiary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            transition: color 0.15s;
        }

        .close:hover { color: var(--text-primary); }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            transition: border-color 0.15s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-focus);
        }

        .form-group small {
            font-size: 11px;
            color: var(--text-tertiary);
            display: block;
            margin-top: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
    </style>

    <div id="errorAlert" class="alert alert-danger" style="display: none;"></div>
    <div id="successAlert" class="alert alert-success" style="display: none;"></div>

    <div class="table-card">
        <div class="section-header" style="padding: 18px 18px 0;">
            <h3>Usuarios del sistema</h3>
            <button class="btn btn-primary" onclick="openCreateModal()">+ Crear usuario</button>
        </div>

        <table class="users-table" style="margin-top: 16px;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Fecha de registro</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="usersBody">
                <tr><td colspan="6" class="empty-state">Cargando...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Crear usuario</h2>
                <button class="close" onclick="closeModal()">&times;</button>
            </div>
            <form id="userForm">
                <div class="form-group">
                    <label for="inputNombre">Nombre</label>
                    <input type="text" id="inputNombre" required>
                </div>
                <div class="form-group">
                    <label for="inputEmail">Correo electrónico</label>
                    <input type="email" id="inputEmail" required>
                </div>
                <div class="form-group">
                    <label for="inputPassword">Contraseña</label>
                    <input type="password" id="inputPassword">
                    <small id="passwordHint" style="display:none;">Dejar en blanco para mantener la contraseña actual</small>
                </div>
                <div class="form-group">
                    <label for="inputRole">Rol</label>
                    <select id="inputRole" style="width:100%; padding:9px 12px; border:1px solid var(--border-color); border-radius:6px; font-size:14px; background:var(--bg-secondary); color:var(--text-primary);">
                        <option value="ADMIN">Administrador</option>
                        <option value="TECHNICAL_STAFF">Personal Técnico</option>
                    </select>
                </div>
                <div id="formError" class="alert alert-danger" style="display: none;"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentUserId = null;

        function roleLabel(role) {
            if (!role || !role.trim()) return 'Usuario';
            const labels = { ADMIN: 'Administrador', TECHNICAL_STAFF: 'Personal Técnico', CLIENT: 'Cliente', INTERNAL_USER: 'Usuario Interno' };
            return labels[role.toUpperCase()] || 'Usuario';
        }

        loadUsers();

        function loadUsers() {
            authFetch('/api/users')
                .then(r => r.json())
                .then(renderUsers)
                .catch(err => showError('Error al cargar usuarios: ' + err.message));
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersBody');
            if (!users.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No hay usuarios registrados</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.nombre}</td>
                    <td>${u.email}</td>
                    <td><span class="role-badge">${roleLabel(u.role)}</span></td>
                    <td>${formatDate(u.createdAt)}</td>
                    <td>
                        <div class="td-actions">
                            <button class="btn btn-sm btn-edit" onclick="editUser(${u.id})">Editar</button>
                            <button class="btn btn-sm btn-delete" onclick="deleteUser(${u.id})">Eliminar</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function formatDate(dateString) {
            if (!dateString) return '—';
            return new Date(dateString).toLocaleDateString('es-ES', {
                year: 'numeric', month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function openCreateModal() {
            currentUserId = null;
            document.getElementById('modalTitle').textContent = 'Crear usuario';
            document.getElementById('userForm').reset();
            document.getElementById('passwordHint').style.display = 'none';
            document.getElementById('formError').style.display = 'none';
            document.getElementById('userModal').classList.add('show');
        }

        function editUser(userId) {
            authFetch(`/api/users/${userId}`)
                .then(r => r.json())
                .then(data => {
                    currentUserId = data.id;
                    document.getElementById('modalTitle').textContent = 'Editar usuario';
                    document.getElementById('inputNombre').value = data.nombre;
                    document.getElementById('inputEmail').value = data.email;
                    document.getElementById('inputPassword').value = '';
                    document.getElementById('inputRole').value = data.role;
                    document.getElementById('passwordHint').style.display = 'block';
                    document.getElementById('formError').style.display = 'none';
                    document.getElementById('userModal').classList.add('show');
                })
                .catch(err => showError('Error al cargar usuario: ' + err.message));
        }

        function deleteUser(userId) {
            if (!confirm('¿Eliminar este usuario?')) return;
            authFetch(`/api/users/${userId}`, { method: 'DELETE' })
                .then(r => {
                    if (r.ok) { showSuccess('Usuario eliminado correctamente'); loadUsers(); }
                    else return r.json().then(e => { throw new Error(e.message); });
                })
                .catch(err => showError('Error al eliminar: ' + err.message));
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('show');
            currentUserId = null;
        }

        document.getElementById('userForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const nombre = document.getElementById('inputNombre').value;
            const email = document.getElementById('inputEmail').value;
            const password = document.getElementById('inputPassword').value;
            const role = document.getElementById('inputRole').value;

            const payload = { nombre, email, role };
            if (password) payload.password = password;

            const method = currentUserId ? 'PUT' : 'POST';
            const url = currentUserId ? `/api/users/${currentUserId}` : '/api/users';

            authFetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => {
                if (r.ok) {
                    showSuccess(currentUserId ? 'Usuario actualizado' : 'Usuario creado');
                    closeModal();
                    loadUsers();
                } else return r.json().then(e => { throw new Error(e.message); });
            })
            .catch(err => {
                document.getElementById('formError').textContent = err.message;
                document.getElementById('formError').style.display = 'block';
            });
        });

        function showError(msg) {
            const el = document.getElementById('errorAlert');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('successAlert');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        window.onclick = e => {
            if (e.target === document.getElementById('userModal')) closeModal();
        };
    </script>
</main>
</body>
</html>
